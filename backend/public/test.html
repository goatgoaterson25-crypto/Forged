<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{background:#101314;color:#e9ece9;font-family:sans-serif;padding:20px}
input,textarea{width:100%;padding:10px;margin:8px 0;background:#171b1c;color:#fff;border:1px solid #333}
button{width:100%;padding:14px;background:#4de8b0;border:none;font-weight:bold}
img{width:100%;margin-top:10px}</style></head>
<body>
<h2>Forge test (hosted)</h2>
<textarea id="p" placeholder="prompt"></textarea>
<button onclick="go()">Generate</button>
<div id="log"></div>
<img id="out" style="display:none">
<script>
async function go(){
  const prompt = document.getElementById('p').value;
  document.getElementById('log').textContent = 'Generating...';
  try {
    const res = await fetch('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    document.getElementById('out').src = data.image;
    document.getElementById('out').style.display='block';
    document.getElementById('log').textContent = 'Done.';
  } catch(e) {
    document.getElementById('log').textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
