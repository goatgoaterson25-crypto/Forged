<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://js.puter.com/v2/"></script>
<style>
  body{background:#101314;color:#e9ece9;font-family:sans-serif;padding:20px}
  input{width:100%;padding:10px;margin:8px 0;background:#171b1c;color:#fff;border:1px solid #333}
  button{width:100%;padding:14px;background:#4de8b0;border:none;font-weight:bold}
  video{width:100%;margin-top:10px}
  #log{font-family:monospace;font-size:12px;color:#93a09c;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Puter.js video test</h2>
<input id="p" value="a cat leaping through an open window">
<button onclick="go()">Generate</button>
<div id="log"></div>
<video id="out" controls style="display:none"></video>
<script>
async function go(){
  const log = document.getElementById('log');
  log.textContent = 'Requesting (will ask you to sign in to Puter first)...';
  try {
    const result = await puter.ai.txt2vid(document.getElementById('p').value);
    log.textContent = 'Done.';
    const v = document.getElementById('out');
    v.src = result.url || result;
    v.style.display = 'block';
  } catch(e) {
    log.textContent = 'Error: ' + (e.message || JSON.stringify(e));
  }
}
</script>
</body>
</html>
